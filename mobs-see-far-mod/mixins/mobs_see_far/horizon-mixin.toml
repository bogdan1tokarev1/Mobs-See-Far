[mod]
id = "mobs_see_far"
version = "1.0.0"
priority = 100

# The commit it was tested on (Nightly 2026-11-07). It hooks the native hook
# points for its switch, its command and its row, and `Mob::tick`, a function
# of the game's own source where a mob's follow range is applied to its AI: that
# one names the source, so the launcher builds the mod on this commit.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# runtime.rs becomes the module crate::mobs_see_far of horizon-client-lib (whose mob
# AI the game calls): the game crate and the library both reach it, so the
# switch the game sets and the range the library writes share one state.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/client_lib.rs"
name = "mobs_see_far"
visibility = "pub"
source = "runtime.rs"

# The switch in Options > Mods, read on the server's thread each tick: the game
# asks this before it ticks a family of entities.
[[injection]]
id = "listen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entity_tick_listened"
helper = "listen.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Every ticking mob: a hostile one is given the mod's follow range.
[[injection]]
id = "mob"
kind = "HEAD"
target = "horizon_client_lib::mobs::Mob::tick"
helper = "mob.rs"
bindings = [
  { name = "mob", ty = "&mut crate::mobs::Mob", value = "&mut *self" },
]

# `/mobsseefar` reports what the mod is doing.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Its row in Options > Mods.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
